<article class="course-card">
  <div class="course-art art-{{ loop.index0 % 4 }}" aria-hidden="true">
    <span class="art-grid"></span>
    <span class="art-code">{{ course.category|upper }}<br><b>{{ "%02d"|format(loop.index) }}</b></span>
    <span class="art-orbit"></span>
  </div>
  <div class="course-card-body">
    <div class="card-meta"><span>{{ course.category }}</span><span>{{ course.duration }}</span></div>
    <h3><a href="/courses/{{ course.slug }}">{{ course.title }}</a></h3>
    <p>{{ course.summary }}</p>
    <div class="course-card-bottom"><span class="level">{{ course.level }}</span><a class="text-link" href="/courses/{{ course.slug }}">Course details <span aria-hidden="true">→</span></a></div>
  </div>
</article>
